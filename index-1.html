<style>
:root{
  --bg:#EEF0F7; --card:#FFFFFF; --ink:#1E2447; --muted:#5D6488; --line:#D9DCEB;
  --accent:#F0A81E; --accent-ink:#3B2A00; --good:#22796F; --bad:#B8385E; --soft:#E3E6F4;
  --serif:'Young Serif',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --hand:'Caveat','Segoe Script',cursive;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12152B;--card:#1B1F3D;--ink:#EDEEFA;--muted:#9EA4C9;--line:#2D3260;--accent:#F5B93A;--accent-ink:#2A1D00;--good:#4FC3B4;--bad:#F07C9C;--soft:#252A52}
}
:root[data-theme="dark"]{--bg:#12152B;--card:#1B1F3D;--ink:#EDEEFA;--muted:#9EA4C9;--line:#2D3260;--accent:#F5B93A;--accent-ink:#2A1D00;--good:#4FC3B4;--bad:#F07C9C;--soft:#252A52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
h1{font-size:30px} h2{font-size:22px;margin-bottom:10px} h3{font-size:17px;margin-bottom:6px}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:120px}
.hand{font-family:var(--hand);font-size:22px;line-height:1.3}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--ink);color:var(--bg);font-weight:700}
button.accent{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--muted);padding:6px 10px;font-weight:500;border:1px solid var(--line)}
button.x{background:transparent;color:var(--muted);padding:4px 8px;font-weight:400;font-size:18px;line-height:1}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.field label{font-size:13px;color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--good);flex:none;padding:0}
.check.done span{text-decoration:line-through;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.bar.gold i{background:var(--accent)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--soft);font-size:13px}
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:22px;margin-bottom:14px}
.hero .muted{color:var(--bg);opacity:.75}
.big{font-family:var(--serif);font-size:44px;line-height:1}
.week{display:flex;gap:6px;margin-top:14px}
.week div{flex:1;text-align:center;font-size:12px}
.week b{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.2);margin-bottom:4px}
.week b.on{background:var(--accent)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;max-width:720px;width:100%}
nav button{flex:1;background:transparent;color:var(--muted);padding:8px 2px;font-size:12px;font-weight:500;border-radius:10px}
nav button[aria-current="true"]{background:var(--soft);color:var(--ink);font-weight:700}
.scroll{overflow-x:auto}
.warn{border-left:4px solid var(--accent);background:var(--soft);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.callout{border-left:4px solid var(--good);background:var(--soft);border-radius:8px;padding:10px 12px;margin:10px 0}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700}
ul{margin:6px 0 0;padding-left:20px} li{margin-bottom:4px}
.entry{border-top:1px solid var(--line);padding:12px 0}
.entry:first-child{border-top:0}
table{border-collapse:collapse;width:100%;font-size:14px} td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.chip{background:var(--soft);border:1px solid var(--line);color:var(--ink);font-weight:500;padding:6px 12px;border-radius:99px;font-size:14px}
.cat{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.cat span:first-child{width:96px;flex:none}
/* ---- colour layer ---- */
body[data-tab="today"]{--tab:#7C5CFC;--tab2:#E64FA0}
body[data-tab="diary"]{--tab:#E64FA0;--tab2:#F2617A}
body[data-tab="body"]{--tab:#14A38B;--tab2:#3DBE6C}
body[data-tab="money"]{--tab:#F5A524;--tab2:#F2617A}
body[data-tab="career"]{--tab:#2F8BF5;--tab2:#7C5CFC}
body[data-tab="hustle"]{--tab:#F2617A;--tab2:#F5A524}
body[data-tab="plan"]{--tab:#7C5CFC;--tab2:#2F8BF5}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--tab) 20%,var(--bg)) 0,var(--bg) 340px) no-repeat,var(--bg);background-color:var(--bg)}
.card{border-top:5px solid var(--tab);box-shadow:0 6px 18px -12px var(--tab)}
h1{color:var(--tab);font-size:34px}
h2::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--tab),var(--tab2));margin-right:9px;vertical-align:1px}
.bar{height:12px}
.bar i,.bar.gold i{background:linear-gradient(90deg,var(--tab),var(--tab2))}
.check input{accent-color:var(--tab)}
button.accent{background:linear-gradient(135deg,var(--tab),var(--tab2));color:#fff}
.hero{background:linear-gradient(135deg,#7C5CFC 0%,#E64FA0 55%,#F5A524 100%);color:#fff;box-shadow:0 12px 28px -14px #E64FA0}
.hero .muted{color:#fff;opacity:.9}
.week b.on{background:#fff}
.glance .field{border-radius:14px;padding:12px;color:#fff}
.glance .field:nth-child(1){background:#0F8C78}
.glance .field:nth-child(2){background:#B36B00}
.glance .field:nth-child(3){background:#2277D6}
.glance .muted{color:rgba(255,255,255,.88)}
.glance b{font-size:20px}
nav button[aria-current="true"]{background:var(--c);color:#fff}
nav button{border-bottom:3px solid transparent}
nav button::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--c);margin:0 auto 3px}
nav button[aria-current="true"]::before{background:#fff}
.pill{background:color-mix(in srgb,var(--tab) 18%,var(--card))}
.callout{border-left-color:var(--tab)}
.chip{border-color:var(--tab)}
details summary{color:var(--tab)}
body[data-tab="diet"]{--tab:#2DB36B;--tab2:#14A38B}
body[data-tab="track"]{--tab:#0FA3B1;--tab2:#7C5CFC}
nav div{overflow-x:auto;scrollbar-width:none}
nav button{flex:1 1 0;min-width:38px;padding:8px 0}
.metric{border-top:1px solid var(--line);padding:12px 0}
nav button{font-size:11px;padding:8px 0}
.chip[aria-pressed="true"]{background:var(--tab);color:#fff;border-color:var(--tab)}
.meal{border-top:1px solid var(--line);padding:12px 0}
.meal div{margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
var KEY='my-life-plan-v1', storageOk=true;

 ['diet','Ate to plan: protein each meal, no sugary drinks, no late snacks'],

 {id:'water',label:'Water',unit:'litres',target:3,quick:[[0.25,'+250 ml'],[0.5,'+500 ml']]},
 {id:'steps',label:'Steps',unit:'steps',target:8000,quick:[[1000,'+1,000'],[2000,'+2,000']]},
 {id:'workout',label:'Workout',unit:'minutes',target:40,quick:[[10,'+10 min'],[20,'+20 min']]},
 {id:'study',label:'Job prep',unit:'minutes',target:165,quick:[[15,'+15 min'],[45,'+45 min']]},
 {id:'post',label:'LetterTales',unit:'minutes',target:15,quick:[[5,'+5 min'],[15,'+15 min']]},

 ['Weeks 1-2: Linux refresh',[['l1','Files, permissions, users, groups, sudo'],['l2','Processes, systemd services, journalctl, cron'],['l3','Package managers (yum, dnf, apt) and repositories'],['l4','Networking: ip, ss, curl, DNS, firewalld, SSH keys'],['l5','Storage: disks, LVM, mounts, fstab, df, du'],['l6','Troubleshooting drill: a slow server (top, free, vmstat, iostat, logs)'],['l7','Bash scripting: variables, loops, functions, grep, awk, sed'],['l8','Git and GitHub basics: commit, branch, pull request'],['l9','PROJECT 1 on GitHub: bash health-check and log report script, with a README']]],
 ['Week 3: Ansible foundations',[['a1','Build a lab: one control node and 2-3 managed VMs, SSH key login'],['a2','Inventory (INI and YAML), groups, ansible.cfg'],['a3','Ad-hoc commands and core modules: ping, command, copy, file, package, service, user'],['a4','YAML properly, and your first playbooks'],['a5','Variables, facts, register, conditionals, loops']]],
 ['Week 4: Ansible in depth',[['a6','Handlers, tags, block and rescue, check mode and diff'],['a7','Jinja2 templates and filters'],['a8','Roles: defaults, vars, tasks, handlers, templates'],['a9','Ansible Vault for secrets'],['a10','Galaxy collections and requirements.yml']]],
 ['Week 5: Ansible advanced and project',[['a11','group_vars, host_vars and dynamic inventory'],['a12','Idempotency, ansible-lint and Molecule basics'],['a13','Use the VMware and Nutanix collections in your lab'],['a14','Understand AWX or Ansible Tower at a high level'],['a15','PROJECT 2 on GitHub: roles that harden Linux servers, install Nginx and deploy an app, with a README'],['a16','Practise 20 Ansible interview questions']]],
 ['Weeks 6-7: Python for automation',[['p1','Python basics: variables, types, loops, functions, lists, dicts'],['p2','Files, error handling, modules, pip and virtualenv'],['p3','Python for ops: os, subprocess, requests, json, yaml'],['p4','Write a small custom Ansible module or filter in Python'],['p5','PROJECT 3 on GitHub: Python tool that checks servers and sends a Slack or email alert']]],
 ['Week 8: Get interview-ready',[['w1','Resume rewritten: Linux, VMware, Nutanix, Ansible, Python, with numbers'],['w2','LinkedIn headline and summary updated'],['w3','3 mock interviews: Linux troubleshooting and Ansible scenarios'],['w4','5 stories ready from your support work: incident, automation, troubleshooting']]],
 ['Job hunt: begin in week 5, once Linux and Ansible are solid',[['h1','Applying to 5 roles daily (Linux, automation, junior DevOps)'],['h2','Messaged 10 people for referrals'],['h3','Asked your current company about an internal automation or infra team']]],
 ['Months 3-5: the rest of DevOps',[['k1','Docker and docker-compose'],['k2','CI/CD with GitHub Actions or Jenkins'],['k3','Kubernetes basics'],['k4','Prometheus and Grafana'],['k5','Terraform and AWS basics'],['k6','SRE: SLI, SLO, error budgets, blameless postmortems']]]
];
var MILESTONES=[[75,'5% lost'],[70,'Halfway'],[65,'Nearly there'],[60,'Goal']];
var CATS=['Food','Travel','Bills','Debt EMI','Shopping','Health','Other'];

function defaults(){return {habits:{},diary:[],weights:[],height:'152',debts:[],expenses:[],goals:{emergency:{target:15000,saved:0},wedding:{budget:0,saved:0}},career:{role:'',done:{},apps:[]},ideas:[],lastBackup:0,outDays:['Wed','Sat','Sun'],why:'',photo:'',pref:'nv',metrics:{},targets:{}}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r),b=defaults();for(var k in b){if(d[k]===undefined)d[k]=b[k]}return d}}catch(e){storageOk=false}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOk=false}}
var S=load();
if(!S.height)S.height='152';
if(!S.career.role)S.career.role='DevOps / SRE Engineer';

function uid(){return Math.random().toString(36).slice(2,9)}
function todayStr(){return new Date().toLocaleDateString('en-CA')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function inr(n){return '\u20B9'+Math.round(n||0).toLocaleString('en-IN')}
function fdate(d){return new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')}
function tgt(id){var v=S.targets[id];if(v!=null&&v>0)return v;for(var i=0;i<TRACK.length;i++)if(TRACK[i].id===id)return TRACK[i].target;return 1}
function curVal(d,id){var v=(S.metrics[d]||{})[id];if(v!=null&&v!=='')return num(v);if((S.habits[d]||{})[id]===true)return tgt(id);return 0}
function doneCount(d){var h=S.habits[d]||{},n=0;TRACK.forEach(function(x){if(curVal(d,x.id)>=tgt(x.id))n++});HABITS.forEach(function(x){if(h[x[0]])n++});return n}
function fmtV(x,v){if(x.id==='steps')return Math.round(v).toLocaleString('en-IN')+' steps';if(x.id==='water')return (Math.round(v*100)/100)+' L';if(x.id==='sleep')return (Math.round(v*10)/10)+' h';return Math.round(v)+' min'}
function streak(){var s=0,i=doneCount(todayStr())>=5?0:1;for(;;i++){if(doneCount(daysAgo(i))>=5)s++;else break;if(i>400)break}return s}

/* ---------- views ---------- */

var MEALS={
 Mon:{b:["Idly + Sambar + groundnut chutney","3 idlis, 1 cup sambar (eat the vegetables), 1 tbsp chutney",["2 boiled eggs","1 cup sprouts and 1 glass of milk"]],
      l:["White Rice + Sambar + cabbage fry","3/4 cup rice, 1 cup sambar, 1 cup cabbage fry","1 small bowl curd"],

 Tue:{b:["Dosa + Sambar + groundnut chutney","2 dosas, 1 cup sambar, 1 tbsp chutney",["2 boiled eggs","1 cup sprouts or 1 glass of milk"]],
      l:["Lemon Rice + Potato fry","3/4 cup lemon rice and 3 tbsp potato fry. Both are starch, so keep both small",["100 g paneer or 2 boiled eggs, plus a cucumber or carrot salad","100 g paneer or 1 cup sprouts, plus a cucumber or carrot salad"]],
      d:["Chapathi + Vegetable curry + Curd Rice","2 chapathis, 1 cup vegetable curry, 1/2 cup curd rice","Nothing extra. Have your fruit."]},
 Wed:{b:["Upma + groundnut chutney","3/4 cup upma, 1 tbsp chutney",["2 boiled eggs and 1 fruit","1 cup sprouts and 1 fruit"]],
      l:["White Rice + Ladyfinger curry + Beetroot fry","3/4 cup rice, 1 cup ladyfinger curry, 1/2 cup beetroot fry","1 glass buttermilk or a small bowl curd"],
      d:["White Rice + Chicken curry + Buttermilk",["1/2 cup rice, 2 chicken pieces with little gravy, 1 glass buttermilk","1/2 cup rice, skip the chicken, take a big portion of vegetables or dal, 1 glass buttermilk"],["A cucumber or carrot salad","100 g paneer or 1 cup sprouts, plus a cucumber or carrot salad"]]},
 Thu:{b:["Dosa + Sambar + groundnut chutney","2 dosas, 1 cup sambar, 1 tbsp chutney",["2 boiled eggs","1 cup sprouts or 1 glass of milk"]],
      l:["Vegetable Rice + Vegetable curry","3/4 cup vegetable rice, 1 cup vegetable curry",["100 g paneer or 2 boiled eggs","100 g paneer or 1 cup sprouts"]],
      d:["Chapathi + Channa curry + white Rice + Rasam + Buttermilk","2 chapathis, 3/4 cup channa curry, rasam, buttermilk. Skip the rice or take only 2 spoons","Nothing extra. Channa is your protein."]},

      l:["White Rice + Sambar + Raw banana fry","3/4 cup rice, 1 cup sambar, 1/2 cup raw banana fry","1 small bowl curd and a salad"],

var TT_WK=[["6:00 AM","Wake up. Drink 2 glasses of water."],["6:15 AM","Workout, 40 min. Strength on Mon, Wed, Fri. Brisk walk on Tue, Thu."],["7:00 AM","Bath and get ready."],["7:30 AM","Hostel breakfast plus your protein add-on."],["8:00 AM","Job prep, 40 min, when your mind is fresh."],["8:50 AM","Leave for office. Carry a fruit and a small box of nuts."],["9:30 AM","Office starts."],["11:00 AM","1 fruit and water."],["1:30 PM","Lunch, then a 10-minute walk."],["4:30 PM","Nuts and 1 fruit."],["6:30 PM","Office ends. Commute is your rest time. Music or a calm podcast, no study."],["7:30 PM","Reach your room. Freshen up."],["7:45 PM","Job prep session 1, 45 min hands-on."],["8:30 PM","Dinner. Keep it light, then a 10-minute walk."],["9:10 PM","Job prep session 2, 80 min hands-on lab."],["10:30 PM","LetterTales, 15 min: reply to comments and note a post idea."],["10:45 PM","Log your day in this app. Then a 5-minute stretch."],["11:00 PM","Sleep. This gives you about 7 hours."]];

var dietSel=null, ttMode=([0,6].indexOf(new Date().getDay())>-1)?"we":"wk";

function pick(x){return Array.isArray(x)?x[S.pref==="v"?1:0]:x}

var breathTimer=null;
function startBreath(){
  var c=document.getElementById("bcircle"),t=document.getElementById("btext");if(!c||!t)return;
  if(breathTimer){clearTimeout(breathTimer);breathTimer=null}
  var steps=[["Breathe in",4,1],["Hold",2,1],["Breathe out",6,0.6]],i=0,total=15;
  function step(){
    if(i>=total){t.textContent="Well done. Notice how you feel.";c.style.transitionDuration="1.5s";c.style.transform="scale(.8)";breathTimer=null;return}
    var st=steps[i%3];t.textContent=st[0];
    c.style.transitionDuration=(st[0]==="Hold"?"0s":st[1]+"s");c.style.transform="scale("+st[2]+")";
    i++;breathTimer=setTimeout(step,st[1]*1000);
  }
  step();
}

}
function bars(x,days){
  var vals=days.map(function(d){return curVal(d,x.id)}),t=tgt(x.id),mx=Math.max(t*1.2,Math.max.apply(null,vals)*1.1)||1;
  var W=600,H=130,P=8,top=10,base=H-22,bw=(W-2*P)/days.length,svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin-top:10px" role="img" aria-label="'+x.label+' per day compared with your target">';
  var ty=base-(base-top)*t/mx;
  vals.forEach(function(v,i){
    var h=(base-top)*v/mx,xx=P+i*bw+bw*0.15,ww=bw*0.7,hh=v>0?Math.max(h,2):2;
    svg+='<rect x="'+xx+'" y="'+(base-hh)+'" width="'+ww+'" height="'+hh+'" rx="3" style="fill:'+(v>=t?'var(--good)':'var(--tab)')+';opacity:'+(v>0?1:0.25)+'"/>';
    if(days.length<=7)svg+='<text x="'+(xx+ww/2)+'" y="'+(H-6)+'" font-size="12" text-anchor="middle" style="fill:var(--muted)">'+new Date(days[i]+'T00:00').toLocaleDateString('en-IN',{weekday:'short'}).slice(0,2)+'</text>';
    else if(i%5===0||i===days.length-1)svg+='<text x="'+(xx+ww/2)+'" y="'+(H-6)+'" font-size="11" text-anchor="middle" style="fill:var(--muted)">'+new Date(days[i]+'T00:00').getDate()+'</text>';
  });
  svg+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+ty+'" y2="'+ty+'" stroke-dasharray="6 5" style="stroke:var(--accent);stroke-width:2"/><text x="'+(W-P)+'" y="'+(ty-5)+'" font-size="12" text-anchor="end" style="fill:var(--muted)">Target</text></svg>';
  return svg;
}

function chart(ws){
  if(ws.length<2)return '<p class="muted small" style="margin-top:10px">Log at least two weights to see your trend line.</p>';
  var W=600,H=170,P=28, ys=ws.map(function(w){return w.kg}), mn=Math.min(58,Math.min.apply(null,ys))-1, mx=Math.max.apply(null,ys)+1;
  function X(i){return P+(W-2*P)*(ws.length===1?0:i/(ws.length-1))}
  function Y(v){return H-P-(H-2*P)*(v-mn)/(mx-mn)}
  var pts=ws.map(function(w,i){return X(i)+','+Y(w.kg)}).join(' ');
  var dots=ws.map(function(w,i){return '<circle cx="'+X(i)+'" cy="'+Y(w.kg)+'" r="4" fill="var(--good)"/>'}).join('');
  return '<div class="scroll"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:320px;margin-top:10px" role="img" aria-label="Weight trend chart"><line x1="'+P+'" x2="'+(W-P)+'" y1="'+Y(60)+'" y2="'+Y(60)+'" stroke="var(--accent)" stroke-dasharray="6 5"/><text x="'+P+'" y="'+(Y(60)-6)+'" font-size="12" fill="var(--muted)">Goal 60 kg</text><polyline points="'+pts+'" fill="none" stroke="var(--good)" stroke-width="3" stroke-linejoin="round"/>'+dots+'<text x="'+P+'" y="'+(H-6)+'" font-size="12" fill="var(--muted)">'+fdate(ws[0].date)+'</text><text x="'+(W-P)+'" y="'+(H-6)+'" font-size="12" text-anchor="end" fill="var(--muted)">'+fdate(ws[ws.length-1].date)+'</text></svg></div>';
}

  else if(a==='delIdea')S.ideas=S.ideas.filter(function(x){return x.id!==id});
  else if(a==='cycleIdea'){S.ideas.forEach(function(x){if(x.id===id)x.status=(x.status+1)%3})}
  else if(a==='starter'){var s=STARTERS[+id];S.ideas.push({id:uid(),kind:s[0],text:s[1],status:0})}
  else if(a==='remind'){makeIcs();return}
  else if(a==='breathe'){startBreath();return}
  else if(a==='rmPhoto'){S.photo=''}
  else if(a==='pref'){S.pref=id}
  else if(a==='range'){trackRange=+id}
  else if(a==='add'){var dt=b.dataset.date||todayStr(),cv=curVal(dt,id);S.metrics[dt]=S.metrics[dt]||{};S.metrics[dt][id]=Math.round((cv+parseFloat(b.dataset.amt))*100)/100;if(S.habits[dt])delete S.habits[dt][id]}
  else if(a==='dietDay'){dietSel=id}
  else if(a==='tt'){ttMode=id}
  else if(a==='outDay'){var oi=S.outDays.indexOf(id);if(oi>-1)S.outDays.splice(oi,1);else S.outDays.push(id)}
  else if(a==='theme'){var r=document.documentElement;if(id==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',id);return}
  else if(a==='copyBackup'){var t=document.getElementById('bk'),m=document.getElementById('bkmsg');t.select();var done=function(){S.lastBackup=Date.now();save();m.textContent='Backup copied. Paste it into a note or chat with yourself.'};try{navigator.clipboard.writeText(t.value).then(done,function(){try{document.execCommand('copy');done()}catch(z){m.textContent='Copy failed. Select the text and copy it by hand.'}})}catch(x){try{document.execCommand('copy');done()}catch(y){m.textContent='Copy failed. Select the text and copy it by hand.'}}return}
  else if(a==='restore'){
    var v=document.getElementById('rs').value.trim(),msg=document.getElementById('bkmsg');
    try{var d=JSON.parse(v),bd=defaults();if(typeof d!=='object'||!d)throw 0;for(var k in bd){if(d[k]===undefined)d[k]=bd[k]}d.photo=S.photo||'';S=d;save();tab='today';render();}catch(x){msg.textContent='That text is not a valid backup. Copy it again in full.'}
    return}
  save();render(true);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form,v=Object.fromEntries(new FormData(f).entries());
  if(k==='diary'){if(!v.text.trim())return;S.diary.push({id:uid(),date:v.date||todayStr(),mood:v.mood,text:v.text.trim()})}
  if(k==='weight')S.weights.push({id:uid(),date:v.date||todayStr(),kg:num(v.kg)});
  if(k==='debt')S.debts.push({id:uid(),name:v.name.trim(),amt:num(v.amt),rate:num(v.rate),emi:num(v.emi)});
  if(k==='expense')S.expenses.push({id:uid(),date:todayStr(),amt:num(v.amt),cat:v.cat,note:(v.note||'').trim()});
  if(k==='app')S.career.apps.push({id:uid(),co:v.co.trim(),role:(v.role||'').trim(),status:'Applied',date:todayStr()});
  if(k==='idea')S.ideas.push({id:uid(),kind:v.kind,text:v.text.trim(),status:0});
  save();render(true);
});
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-change]');if(!el)return;
  var c=el.dataset.change,id=el.dataset.id;
  if(c==='why'){S.why=el.value;save();return}
  if(c==='photo'){
    var f=el.files&&el.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();im.onload=function(){var r=Math.min(1,720/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.photo=cv.toDataURL('image/jpeg',0.72);save();render(true)};im.src=fr.result};
    fr.readAsDataURL(f);return}
  if(c==='metric'){var dt=el.dataset.date||todayStr(),raw=el.value.trim();S.metrics[dt]=S.metrics[dt]||{};if(raw==='')delete S.metrics[dt][id];else S.metrics[dt][id]=Math.max(0,num(raw));if(S.habits[dt])delete S.habits[dt][id]}
  if(c==='target'){var nv=num(el.value);if(nv>0)S.targets[id]=nv;else delete S.targets[id]}
  if(c==='trackDate'){if(el.value)trackDate=el.value;render(true);return}
  if(c==='habit'){var t=el.dataset.date||todayStr();S.habits[t]=S.habits[t]||{};S.habits[t][id]=el.checked}
  if(c==='road')S.career.done[id]=el.checked;
  if(c==='role'){S.career.role=el.value;save();return}
  if(c==='height'){S.height=el.value}
  if(c==='goalTarget')S.goals[id][id==='wedding'?'budget':'target']=num(el.value);
  if(c==='goalSaved')S.goals[id].saved=num(el.value);
  if(c==='appStatus'){S.career.apps.forEach(function(a){if(a.id===id)a.status=el.value})}
  save();render(true);
});
document.addEventListener('input',function(e){
  if(e.target.id==='dsearch')document.getElementById('dlist').innerHTML=diaryList(e.target.value);
});

render();

try{
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
  if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
}catch(e){}
})();
</script>
